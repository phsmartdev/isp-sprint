<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" type="image/png" href="/brand/bkt-symbol.png" />
    <meta name="theme-color" content="#2D3339" />
    <title>BKT · RevOps</title>
    <script>
      // tema escolhido no menu da conta, aplicado antes da primeira pintura (sem piscar claro)
      try {
        var t = localStorage.getItem('isp:theme');
        var dark = t === 'escuro' || (t === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        if (dark) document.querySelector('meta[name="color-scheme"]').setAttribute('content', 'dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
