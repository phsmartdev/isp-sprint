# Rotina dos Dados Planejados: lê o GLPI e manda os avisos de SLA a cada 5 minutos, mesmo com o RevOps fechado.
# Chama /api/v1/cron/glpi-sla com o mesmo CRON_SECRET configurado na Vercel.
# Configure em Settings → Secrets and variables → Actions:
#   - segredo CRON_SECRET: copie o valor da variável CRON_SECRET da Vercel (projeto revops → Settings → Environment Variables)
#   - variável REVOPS_URL (opcional): endereço de produção; padrão https://revops-khaki.vercel.app
name: Rotina GLPI (Dados Planejados)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: rotina-glpi-sla
  cancel-in-progress: false

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ler o GLPI e conferir os avisos
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          REVOPS_URL: ${{ vars.REVOPS_URL || 'https://revops-khaki.vercel.app' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::notice::Segredo CRON_SECRET não configurado neste repositório; rotina ignorada."
            exit 0
          fi
          code=$(curl -sS -o resposta.json -w '%{http_code}' --max-time 240 \
            -H "Authorization: Bearer $CRON_SECRET" "$REVOPS_URL/api/v1/cron/glpi-sla")
          echo "HTTP $code"
          head -c 600 resposta.json; echo
          test "$code" = 200
